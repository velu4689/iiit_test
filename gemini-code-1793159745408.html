<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TrueFoundry Simplified Animated HLD (3 Control Towers & 4 Okta Auth Servers)</title>
<style>
  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
  .container { max-width: 1400px; margin: 0 auto; background: #ffffff; border-radius: 14px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
  h1 { color: #0f172a; font-size: 22px; margin-bottom: 4px; }
  .sub { color: #64748b; font-size: 13px; margin-bottom: 20px; }
  svg { width: 100%; height: auto; display: block; background: #ffffff; border-radius: 8px; }

  /* CSS Motion Animations */
  @keyframes pulseGlow {
    0% { opacity: 0.4; filter: drop-shadow(0 0 2px rgba(37,99,235,0.4)); }
    50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(37,99,235,0.8)); }
    100% { opacity: 0.4; filter: drop-shadow(0 0 2px rgba(37,99,235,0.4)); }
  }
  @keyframes dashMove {
    to { stroke-dashoffset: -24; }
  }
  .animated-tunnel {
    stroke: #2563eb;
    stroke-width: 3;
    stroke-dasharray: 8, 4;
    animation: dashMove 1s linear infinite;
  }
  .animated-prod {
    stroke: #059669;
    stroke-width: 3;
    stroke-dasharray: 8, 4;
    animation: dashMove 1s linear infinite;
  }
  .pulsing-node {
    animation: pulseGlow 2s ease-in-out infinite;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Simplified HLD — Motion-Enabled Architecture</h1>
  <div class="sub">Showing Developer Tunnel Stream (Blue), Production Workload Stream (Green), 4 Okta Auth Servers, and 3 Control Towers.</div>

  <svg viewBox="0 0 1380 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
      </marker>
      <marker id="arr-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
      </marker>
      <marker id="arr-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1 L 10 5 L 0 9 z" fill="#7e22ce"/>
      </marker>
    </defs>

    <!-- ZONE 1: DEVELOPER WORKSTATION -->
    <rect x="30" y="40" width="280" height="300" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="170" y="68" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">1. Developer Laptop</text>
    <rect x="50" y="85" width="240" height="70" rx="6" fill="#ffffff" stroke="#2563eb"/>
    <text x="170" y="110" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">Kiro IDE + CLI</text>
    <text x="170" y="130" fill="#475569" font-size="10" text-anchor="middle">Non-Prod Script Testing</text>

    <rect x="50" y="170" width="240" height="150" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="170" y="195" fill="#92400e" font-size="12" font-weight="bold" text-anchor="middle">EC2 Bastion Tunnel</text>
    <text x="170" y="215" fill="#78350f" font-size="10" text-anchor="middle">SSM / SSH Secure Pipe</text>
    <text x="170" y="235" fill="#dc2626" font-size="10" font-weight="bold" text-anchor="middle">⛔ No Bastion Access to Prod</text>

    <!-- ZONE 2: PRODUCTION WORKLOADS -->
    <rect x="30" y="370" width="280" height="310" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="170" y="398" fill="#047857" font-size="13" font-weight="bold" text-anchor="middle">2. Prod Workloads (EKS/ECS)</text>
    <rect x="50" y="420" width="240" height="110" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="170" y="445" fill="#065f46" font-size="12" font-weight="bold" text-anchor="middle">Deployed Agents &amp; MCPs</text>
    <text x="170" y="465" fill="#334155" font-size="10" text-anchor="middle">Uses App-Scoped Virtual</text>
    <text x="170" y="482" fill="#334155" font-size="10" text-anchor="middle">Account Tokens (VATs)</text>

    <rect x="50" y="545" width="240" height="115" rx="6" fill="#ffffff" stroke="#059669"/>
    <text x="170" y="570" fill="#065f46" font-size="12" font-weight="bold" text-anchor="middle">AWS Secrets Manager</text>
    <text x="170" y="590" fill="#334155" font-size="10" text-anchor="middle">CI/CD automatically mounts</text>
    <text x="170" y="608" fill="#334155" font-size="10" text-anchor="middle">team/app secrets at runtime</text>

    <text x="505" y="68" fill="#0369a1" font-size="14" font-weight="bold" text-anchor="middle">3. Okta IDP (4 Custom Auth Servers)</text>

    <text x="505" y="115" fill="#1d4ed8" font-size="11" font-weight="bold" text-anchor="middle">Non-Prod Standard Auth Server</text>
    <text x="505" y="135" fill="#334155" font-size="10" text-anchor="middle">`aus-np-std` (PKCE Dev Login)</text>
    <text x="505" y="153" fill="#334155" font-size="10" text-anchor="middle">TTL: 4-8 hrs | Trusted by Non-Prod DPs</text>

    <rect x="375" y="225" width="260" height="120" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="505" y="250" fill="#b45309" font-size="11" font-weight="bold" text-anchor="middle">Non-Prod CPNI Auth Server</text>
    <text x="505" y="270" fill="#334155" font-size="10" text-anchor="middle">`aus-np-cpni` (Step-Up MFA)</text>
    <text x="505" y="288" fill="#334155" font-size="10" text-anchor="middle">TTL: 1 hr | Trusted by CPNI Non-Prod DPs</text>

    <rect x="375" y="360" width="260" height="120" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="505" y="385" fill="#047857" font-size="11" font-weight="bold" text-anchor="middle">Prod Standard Auth Server</text>
    <text x="505" y="405" fill="#334155" font-size="10" text-anchor="middle">`aus-prod-std` (Limited Scope M2M)</text>
    <text x="505" y="423" fill="#dc2626" font-size="10" font-weight="bold" text-anchor="middle">⛔ Dev PKCE Login Disabled</text>

    <rect x="375" y="495" width="260" height="120" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <text x="505" y="520" fill="#991b1b" font-size="11" font-weight="bold" text-anchor="middle">Prod CPNI Auth Server</text>
    <text x="505" y="540" fill="#334155" font-size="10" text-anchor="middle">`aus-prod-cpni` (Strict Air-Gap M2M)</text>
    <text x="505" y="558" fill="#dc2626" font-size="10" font-weight="bold" text-anchor="middle">⛔ Strict Regulated Access Only</text>

    <!-- ZONE 4: TRUEFOUNDRY CONTROL PLANE & 3 CONTROL TOWERS (12 DATA PLANES) -->
    <rect x="700" y="40" width="650" height="640" rx="10" fill="#f8fafc" stroke="#7e22ce" stroke-width="2"/>
    <text x="1025" y="68" fill="#581c87" font-size="14" font-weight="bold" text-anchor="middle">4. TrueFoundry SaaS Control Plane &amp; 3 Control Towers (12 Data Planes)</text>

    <!-- SaaS Control Plane Box -->
    <rect x="725" y="90" width="600" height="90" rx="8" fill="#0f172a"/>
    <text x="1025" y="115" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">TrueFoundry Central SaaS Control Plane &amp; FinOps Engine</text>
    <text x="1025" y="138" fill="#f8fafc" font-size="10" text-anchor="middle">Real-time NATS Sync | Multi-App Cost Attribution (CT ➔ Env ➔ Team ➔ App)</text>

    <!-- Control Towers Grid -->
    <rect x="725" y="200" width="190" height="460" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="820" y="225" fill="#1d4ed8" font-size="12" font-weight="bold" text-anchor="middle">Control Tower 1</text>
    <text x="820" y="245" fill="#334155" font-size="10" text-anchor="middle">• Non-Prod DP</text>
    <text x="820" y="265" fill="#334155" font-size="10" text-anchor="middle">• CPNI Non-Prod DP</text>
    <text x="820" y="285" fill="#334155" font-size="10" text-anchor="middle">• Prod DP</text>
    <text x="820" y="305" fill="#334155" font-size="10" text-anchor="middle">• CPNI Prod DP</text>
    <text x="820" y="350" fill="#64748b" font-size="9" text-anchor="middle">Teams A, B...</text>
    <text x="820" y="365" fill="#64748b" font-size="9" text-anchor="middle">Multi-App Virtual Accounts</text>

    <rect x="930" y="200" width="190" height="460" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/>
    <text x="1025" y="225" fill="#7e22ce" font-size="12" font-weight="bold" text-anchor="middle">Control Tower 2</text>
    <text x="1025" y="245" fill="#334155" font-size="10" text-anchor="middle">• Non-Prod DP</text>
    <text x="1025" y="265" fill="#334155" font-size="10" text-anchor="middle">• CPNI Non-Prod DP</text>
    <text x="1025" y="285" fill="#334155" font-size="10" text-anchor="middle">• Prod DP</text>
    <text x="1025" y="305" fill="#334155" font-size="10" text-anchor="middle">• CPNI Prod DP</text>
    <text x="1025" y="350" fill="#64748b" font-size="9" text-anchor="middle">Teams C, D...</text>
    <text x="1025" y="365" fill="#64748b" font-size="9" text-anchor="middle">Multi-App Virtual Accounts</text>

    <rect x="1135" y="200" width="190" height="460" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="1230" y="225" fill="#047857" font-size="12" font-weight="bold" text-anchor="middle">Control Tower 3</text>
    <text x="1230" y="245" fill="#334155" font-size="10" text-anchor="middle">• Non-Prod DP</text>
    <text x="1230" y="265" fill="#334155" font-size="10" text-anchor="middle">• CPNI Non-Prod DP</text>
    <text x="1230" y="285" fill="#334155" font-size="10" text-anchor="middle">• Prod DP</text>
    <text x="1230" y="305" fill="#334155" font-size="10" text-anchor="middle">• CPNI Prod DP</text>
    <text x="1230" y="350" fill="#64748b" font-size="9" text-anchor="middle">Teams E, F...</text>
    <text x="1230" y="365" fill="#64748b" font-size="9" text-anchor="middle">Multi-App Virtual Accounts</text>

    <!-- ANIMATED MOTION CONNECTORS -->
    <!-- Developer Tunnel Stream (Animated Blue Dashes) -->
    <path d="M 290 245 L 350 245" class="animated-tunnel" marker-end="url(#arr-b)"/>
    <path d="M 635 150 L 700 240" class="animated-tunnel" marker-end="url(#arr-b)"/>

    <!-- Prod Workload Stream (Animated Green Dashes) -->
    <path d="M 290 475 L 350 475" class="animated-prod" marker-end="url(#arr-g)"/>
    <path d="M 635 420 L 725 420" class="animated-prod" marker-end="url(#arr-g)"/>
  </svg>
</div>

</body>
</html>
